<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fortnite Shorts – Preview & Export</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020617;
      color: #e5e7eb;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      width: 360px;
      max-width: 100%;
    }

    h1 {
      font-size: 1.1rem;
      margin-bottom: 0.25rem;
      text-align: center;
    }

    p {
      font-size: 0.8rem;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    input, button {
      width: 100%;
      margin-bottom: 0.4rem;
    }

    .controls {
      font-size: 0.7rem;
      margin-bottom: 0.4rem;
    }

    .shorts-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 1rem;
      background: black;
    }

    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(30px) brightness(0.85);
      transform: scale(1.2);
      z-index: 1;
    }

    .texture {
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      mix-blend-mode: overlay;
      pointer-events: none;
      z-index: 2;
    }

    .fg-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 3;
      transform-origin: center;
    }

    .fg-video {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .overlay-text {
      position: absolute;
      left: 50%;
      transform: translate(-50%, -50%);
      background: white;
      color: black;
      padding: 0.35rem 0.6rem;
      border-radius: 0.6rem;
      font-weight: 800;
      font-size: 0.85rem;
      z-index: 4;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      white-space: nowrap;
    }

    progress {
      width: 100%;
      height: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Fortnite Shorts</h1>
    <p>YT Shorts • Preview • Export</p>

    <!-- MAIN VIDEO SIZE SLIDER (moved here) -->
    <label style="font-size:0.7rem">Main video size</label>
    <input
      id="sizeSlider"
      type="range"
      min="0.7"
      max="3"
      step="0.01"
      value="1"
    />

    <input id="videoInput" type="file" accept="video/*" />
    <progress id="progress" value="0" max="100"></progress>

    <div class="controls">
      <label>Text</label>
      <input id="textInput" type="text" value="POV: killing a oce pro" />

      <label>Title Y position</label>
      <input
        id="titleYSlider"
        type="range"
        min="0.05"
        max="0.4"
        step="0.005"
        value="0.12"
      />
    </div>

    <div class="shorts-frame">
      <video id="bgVideo" class="bg-video" muted loop playsinline></video>
      <div class="texture"></div>
      <div id="fgWrapper" class="fg-wrapper">
        <video id="fgVideo" class="fg-video" controls playsinline></video>
      </div>
      <div id="overlayText" class="overlay-text">POV: killing a oce pro</div>
    </div>

    <button id="exportBtn">Export video</button>
  </div>

  <script>
    const input = document.getElementById('videoInput');
    const bg = document.getElementById('bgVideo');
    const fg = document.getElementById('fgVideo');
    const fgWrapper = document.getElementById('fgWrapper');
    const slider = document.getElementById('sizeSlider');
    const exportBtn = document.getElementById('exportBtn');
    const progress = document.getElementById('progress');
    const textInput = document.getElementById('textInput');
    const overlayText = document.getElementById('overlayText');
    const titleYSlider = document.getElementById('titleYSlider');

    const canvas = document.createElement('canvas');
    canvas.width = 1080;
    canvas.height = 1920;
    const ctx = canvas.getContext('2d');

    let recorder;
    let chunks = [];
    let recording = false;

    /* sync background playback */
    fg.addEventListener('play', () => bg.play());
    fg.addEventListener('pause', () => bg.pause());
    fg.addEventListener('seeking', () => bg.currentTime = fg.currentTime);

    function updateTitle() {
      overlayText.textContent = textInput.value;
    }

    function updateTitlePosition() {
      overlayText.style.top = `${Number(titleYSlider.value) * 100}%`;
    }

    textInput.addEventListener('input', updateTitle);
    titleYSlider.addEventListener('input', updateTitlePosition);

    updateTitle();
    updateTitlePosition();

    function draw() {
      if (!recording) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.filter = 'blur(30px)';
      ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      ctx.filter = 'none';

      const scale = Number(slider.value);
      const vw = fg.videoWidth;
      const vh = fg.videoHeight;

      if (vw && vh) {
        const ratio = Math.min(canvas.width / vw, canvas.height / vh) * scale;
        const w = vw * ratio;
        const h = vh * ratio;
        ctx.drawImage(
          fg,
          (canvas.width - w) / 2,
          (canvas.height - h) / 2,
          w,
          h
        );
      }

      const text = overlayText.textContent;
      if (text.trim()) {
        ctx.font = 'bold 64px system-ui, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const padding = 20;
        const metrics = ctx.measureText(text);
        const bw = metrics.width + padding * 2;
        const bh = 90;
        const x = canvas.width / 2;
        const y = canvas.height * Number(titleYSlider.value);

        ctx.fillStyle = 'white';
        ctx.beginPath();
        ctx.roundRect(x - bw / 2, y - bh / 2, bw, bh, 30);
        ctx.fill();

        ctx.fillStyle = 'black';
        ctx.fillText(text, x, y);
      }

      requestAnimationFrame(draw);
    }

    input.addEventListener('change', () => {
      const file = input.files[0];
      if (!file) return;
      const url = URL.createObjectURL(file);
      bg.src = url;
      fg.src = url;
      bg.load();
      fg.load();
      progress.value = 0;

      fg.onloadedmetadata = () => {
        bg.currentTime = 0;
        fg.currentTime = 0;
        fg.play();
      };
    });

    slider.addEventListener('input', () => {
      fgWrapper.style.transform = `scale(${slider.value})`;
    });

    exportBtn.addEventListener('click', () => {
      if (fg.readyState < 2) {
        alert('Upload a video first');
        return;
      }

      chunks = [];
      recording = true;
      progress.value = 0;

      const stream = canvas.captureStream(30);
      fg.captureStream().getAudioTracks().forEach(t => stream.addTrack(t));

      recorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      recorder.ondataavailable = e => chunks.push(e.data);
      recorder.onstop = () => {
        recording = false;
        const blob = new Blob(chunks, { type: 'video/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'yt-short.webm';
        a.click();
      };

      fg.currentTime = 0;
      bg.currentTime = 0;
      fg.play();

      recorder.start();
      draw();

      fg.ontimeupdate = () => {
        progress.value = Math.min(
          100,
          (fg.currentTime / fg.duration) * 100
        );
      };

      fg.onended = () => recorder.stop();
    });
  </script>
</body>
</html>
